<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Website panels admit public HTTPS frame targets only after a local
         user gesture. Their iframe is separately sandboxed without same-origin
         authority or ambient permissions. Media URLs remain HTTPS-only. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="frame-src https:; media-src 'self' blob: https:; object-src 'none'"
    />
    <meta name="theme-color" content="#f4f0e8" />
    <meta name="description" content="A browser-authoritative universal 2D and 3D component workspace for people and agents." />
    <link rel="icon" href="data:image/svg+xml,&lt;svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'&gt;&lt;rect width='64' height='64' rx='14' fill='%232c332f'/&gt;&lt;path d='M15 19h34M15 32h25M15 45h17' stroke='%23df7853' stroke-width='6' stroke-linecap='round'/&gt;&lt;/svg&gt;" />
    <title>SemaFrame — Semantic Spatial Workspace</title>
  </head>

  </body>
</html>

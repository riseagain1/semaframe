<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Website panels admit public HTTPS frame targets only after a local
         user gesture. Their iframe is separately sandboxed without same-origin
         authority or ambient permissions. Media URLs remain HTTPS-only. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="frame-src https:; media-src 'self' blob: https:; object-src 'none'"
    />
    <meta name="theme-color" content="#f4f0e8" />
    <meta name="description" content="A browser-authoritative universal 2D and 3D component workspace for people and agents." />
    <meta property="og:title" content="SemaFrame — Semantic Spatial Workspace" />
    <meta property="og:description" content="Build spaces agents can understand: 2D, 3D, live data, interaction, collision, and bounded physics in one workspace." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/semaframe-social.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/semaframe-favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/semaframe-icon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/semaframe-apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>SemaFrame — Semantic Spatial Workspace</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
